      {
        "@context": "https://schema.org",

            "@id": "https://zenler.vercel.app/#organization",
            "name": "Zenler",
            "url": "https://www.newzenler.com/",

          {
            "@type": "WebSite",
            "@id": "https://zenler.vercel.app/#website",

            "name": "Zenler FAQ Support Agent",
            "inLanguage": "en",
            "publisher": {
              "@id": "https://zenler.vercel.app/#organization"
            }
          },
          {
            "@type": "WebApplication",
            "@id": "https://zenler.vercel.app/#app",
            "name": "Zenler FAQ Support Agent",
            "url": "https://zenler.vercel.app/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Any",
            "inLanguage": "en",
            "description": "A Zenler FAQ answer system for courses, memberships, marketing funnels, communities, live sessions, email, automations, payments, domains and analytics."
          },
          {
            "@type": "FAQPage",
            "@id": "https://zenler.vercel.app/#faq",
            "inLanguage": "en",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What marketing tools does Zenler have?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Zenler includes Marketing Funnels, Email Broadcasts, Zenler Mail, Automations, Blog and SEO tools, Communities, Lives, coupons, payments, affiliate tools and analytics."
                }
              },
              {
                "@type": "Question",
                "name": "Does Zenler have Zoom?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Zenler has Zoom built into the platform through Zenler Live, so most users do not need a separate Zoom subscription. Zenler uses an enterprise-level Zoom setup for Live Webinars, Interactive Webinars, Live Classes, Live Streams and one-to-one bookings. You can also charge for live classes, interactive webinars and one-to-one sessions."
                }
              },
              {
                "@type": "Question",
                "name": "Can Zenler drip course content?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Zenler supports drip schedules for courses so sections or lessons can be released over time."
                }
              }
            ]
          }
        ]
      }

              webinars, interactive webinars, live streams and one-to-one bookings.
